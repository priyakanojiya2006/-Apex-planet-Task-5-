<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PriShop Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <h1>PriShop Pro</h1>

  <input type="text" id="search" placeholder="Search products...">

  <a href="#" onclick="showCart()">
    🛒 Cart (<span id="cart-count">0</span>)
  </a>
</nav>

<header>
  <h2>Our Products</h2>

  <div class="filters">
    <button onclick="filterCategory('all')">All</button>
    <button onclick="filterCategory('electronics')">Electronics</button>
    <button onclick="filterCategory('fashion')">Fashion</button>
    <button onclick="filterCategory('accessories')">Accessories</button>
  </div>
</header>

<main>
  <div id="product-list"></div>
</main>

<!-- CART MODAL -->
<div id="cart-modal" class="modal">
  <div class="modal-content">
    <span onclick="closeCart()" class="close">&times;</span>
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <h3 id="total"></h3>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
